name: commit clock

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/clock.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git config user.name "pirrot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-clock.svg README.md
          git diff --cached --quiet || { git commit -m "redraw commit clock 🦜"; git push; }
